/* ============================================================
   NUNNER PIXEL — tutta la grafica è disegnata a bassa risoluzione
   e ingrandita a pixel interi. Nessuna immagine esterna.
   ============================================================ */
:root{
  --ink:#0b0712; --plum:#1b1228; --plum2:#2a1c3c;
  --gold:#f6c945; --gold-d:#b5812c; --cream:#f4ecdc;
  --rose:#ff4f8b; --wine:#7a1428; --wine-d:#4a0c18; --wine-l:#b83250;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);
  -webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}

#btn-pause,#btn-mute{position:absolute;top:10px;right:10px;z-index:5;width:40px;height:40px;
  font-family:'Press Start 2P',monospace;font-size:12px;color:var(--gold);background:var(--plum);
  border:none;cursor:pointer;box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--gold-d);display:none;padding:0}
#btn-pause i{display:inline-block;width:5px;height:15px;margin:0 2px;background:var(--gold);vertical-align:middle}  /* simbolo pausa: due barre */
#btn-mute{right:62px;color:var(--gold)}
#btn-mute svg{display:block;margin:auto}
#btn-mute .off,#btn-mute.muted .on{display:none}
#btn-mute.muted .off{display:inline}


#overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(11,7,18,.78)}
.card{position:relative;width:calc(100% - 40px);max-width:620px;max-height:calc(100% - 36px);overflow:auto;
  background:var(--plum);color:var(--cream);padding:20px 22px 22px;text-align:center;touch-action:pan-y;
  box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--gold-d),0 0 0 12px var(--ink),12px 12px 0 12px rgba(0,0,0,.45)}
.card h1{font-family:'Press Start 2P',monospace;font-size:clamp(22px,5vw,34px);color:var(--gold);
  letter-spacing:2px;text-shadow:4px 4px 0 var(--wine);margin:4px 0 10px}
.card h2{font-family:'Press Start 2P',monospace;font-size:clamp(14px,3vw,20px);color:var(--gold);
  text-shadow:3px 3px 0 var(--wine);margin:4px 0 10px}
.card .sub{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--rose);letter-spacing:1px;margin-bottom:14px}
.card p{font-family:'VT323',monospace;font-size:21px;line-height:1.15;color:#d9cbe0;margin:8px 0}
.card p b{color:var(--gold);font-weight:normal}
.card .sec-t{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gold);margin:16px 0 8px;letter-spacing:1px}
.card .sec-t.bad{color:var(--rose)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;text-align:left}
.legend div{display:flex;align-items:center;gap:8px;font-family:'VT323',monospace;font-size:18px;line-height:1;color:#d9cbe0}
.legend b{color:var(--gold);font-weight:normal;display:block;font-size:19px}
.legend img{width:28px;height:28px;flex-shrink:0;image-rendering:pixelated}
.sins{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px}
.sins div{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'VT323',monospace;font-size:17px;color:#ffb3cb}
.sins img{width:32px;height:32px;image-rendering:pixelated}
.card .big{font-family:'Press Start 2P',monospace;font-size:clamp(24px,6vw,38px);color:var(--cream);margin:10px 0 4px;text-shadow:4px 4px 0 var(--wine)}
.card .verse{font-style:italic;color:#a88fb6}
.card button{font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:1px;
  margin:12px 6px 0;padding:13px 16px;color:#fff2b0;background:var(--wine);border:none;cursor:pointer;
  box-shadow:inset -4px -4px 0 var(--wine-d),inset 4px 4px 0 var(--wine-l),0 0 0 4px var(--ink)}
.card button:hover,.card button:focus-visible{background:#9a1c38;outline:none;transform:translateY(-2px)}
.card button.alt{background:#2e2a56;box-shadow:inset -4px -4px 0 #1a1736,inset 4px 4px 0 #4a4588,0 0 0 4px var(--ink)}
.card .keys{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 16px;margin:14px 0 4px;
  font-family:'VT323',monospace;font-size:18px;color:#a88fb6}
.card .keys span{white-space:nowrap}                       /* si va a capo tra un comando e l'altro, mai in mezzo */
.kbd{display:inline-block;font-family:'Press Start 2P',monospace;font-size:8px;line-height:1;color:var(--gold);
  background:#241a30;border:2px solid #6a5a7a;border-bottom-width:4px;padding:4px 5px 3px;margin-right:5px;vertical-align:2px}
.card .note{font-size:18px;color:#ffb3cb;margin:8px 0 0}
.card .credit{margin-top:14px;font-family:'VT323',monospace;font-size:17px;color:#8a7a9a}
.card .fedeli{margin-top:12px;font-family:'VT323',monospace;font-size:19px;color:var(--gold)}
.card .fedeli svg{vertical-align:-1px;margin-right:6px}
.card button.link{font-family:'VT323',monospace;font-size:17px;letter-spacing:0;margin:0;padding:0;color:var(--gold);
  background:none;box-shadow:none;text-decoration:underline;text-underline-offset:3px}
.card button.link:hover,.card button.link:focus-visible{background:none;transform:none;color:#fff2b0}
.card .crucis{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 12px;margin:6px 0 2px;
  font-family:'VT323',monospace;font-size:19px;color:#ffb3cb}
.card .crucis span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.card .crucis img{width:20px;height:20px;image-rendering:pixelated}
.card .crucis em{font-style:normal;color:#a88fb6}
.card a.btn{display:inline-block;font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:1px;margin:12px 6px 0;
  padding:13px 16px;color:#fff2b0;text-decoration:none;background:#2e2a56;
  box-shadow:inset -4px -4px 0 #1a1736,inset 4px 4px 0 #4a4588,0 0 0 4px var(--ink)}
.card a.btn:hover,.card a.btn:focus-visible{background:#3a3570;outline:none;transform:translateY(-2px)}
.card .lang{position:absolute;top:10px;right:10px;display:flex;gap:4px}
#ilang{position:absolute;top:8px;left:10px;z-index:6;display:none;gap:4px}
#ilang button{font-family:'Press Start 2P',monospace;font-size:8px;padding:5px 6px 4px;color:#8a7a9a;background:#140c1c;
  border:2px solid #4a3a5a;cursor:pointer}
#ilang button.on{color:var(--gold);border-color:var(--gold-d)}
#isnd{margin-left:6px;line-height:0}#isnd svg{display:block}
#isnd .off,#isnd.muted .on{display:none}#isnd.muted .off{display:inline}#isnd.muted{color:#8a7a9a}#isnd:not(.muted){color:var(--gold);border-color:var(--gold-d)}
.card .lang button{font-size:8px;letter-spacing:0;margin:0;padding:5px 6px 4px;color:#8a7a9a;background:#241a30;
  border:2px solid #4a3a5a;box-shadow:none}
.card .lang button.on{color:var(--gold);border-color:var(--gold-d)}
.card .lang button:hover,.card .lang button:focus-visible{background:#2e2240;transform:none}
@media (max-width:520px){.legend{grid-template-columns:1fr}.card{padding:16px 14px}
  .card .lang{position:static;justify-content:flex-end;margin-bottom:4px}}
</style>
</head>

'x':'00000 00000 10001 01010 00100 01010 10001','%':'11000 11001 00010 00100 01000 10011 00011','=':'00000 00000 11111 00000 11111 00000 00000',
'(':'00010 00100 01000 01000 01000 00100 00010',')':'01000 00100 00010 00010 00010 00100 01000','*':'00000 00100 10101 01110 10101 00100 00000',
'#':'01010 01010 11111 01010 11111 01010 01010'
}).map(([k,v])=>[k,v.replace(/ /g,'')]));
const FONT3={w:3,h:5,adv:4,g:GLYPH}, FONT5={w:5,h:7,adv:6,g:GLYPH5};
function normTxt(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/X(?=\d)/g,'x');}
function textW(s,sc=1,f=FONT3){s=normTxt(s);return s.length?(s.length*f.adv-1)*sc:0;}
/* spezza una frase in righe larghe al massimo "max" pixel (per gli schermi stretti) */
function textLines(s,max,sc=1,f=FONT3){const out=[];let line='';
  for(const w of String(s).split(' ')){const t=line?line+' '+w:w;if(line&&textW(t,sc,f)>max){out.push(line);line=w;}else line=t;}
  if(line)out.push(line);return out;}
const TXT=new Map();
function textCanvas(s,col,sc,outline,shadow,f=FONT3){
  const key=s+'|'+col+'|'+sc+'|'+outline+'|'+shadow+'|'+f.w;
  let c=TXT.get(key);if(c)return c;
  if(TXT.size>500)TXT.clear();
  const pad=outline?1:0, sh=shadow?sc:0, n=f.w*f.h;      // contorno sempre di 1 pixel
  c=mk(textW(s,sc,f)+pad*2+sh,f.h*sc+pad*2+sh);
  const g=c.getContext('2d');
  const paint=(ox,oy,color)=>{g.fillStyle=color;let x=ox;
    for(const ch of s){const gl=f.g[ch]||f.g['?'];
      for(let i=0;i<n;i++)if(gl[i]==='1')g.fillRect(x+(i%f.w)*sc,oy+((i/f.w)|0)*sc,sc,sc);
      x+=f.adv*sc;}};
  if(shadow)paint(pad+sh,pad+sh,shadow);
  if(outline)for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++)if(ox||oy)paint(pad+ox,pad+oy,outline);
  paint(pad,pad,col);
  TXT.set(key,c);return c;
}
/* text(g,"CIAO",x,y,col,{sc,align,outline,shadow,font}) — y è il bordo alto delle lettere; font: FONT3 (di base) o FONT5.
   Si compone lettera per lettera da immagini in cache: il punteggio che cambia
   a ogni fotogramma non crea immagini nuove. Il risultato è identico al pixel. */
function text(g,s,x,y,col,o={}){
  const f=o.font||FONT3, sc=o.sc||1, pad=o.outline?1:0, t=normTxt(s), tw=textW(t,sc,f);
  const dx=Math.round(o.align==='center'?x-tw/2:o.align==='right'?x-tw:x)-pad, dy=Math.round(y-pad);
  for(let i=0;i<t.length;i++)if(t[i]!==' ')g.drawImage(textCanvas(t[i],col,sc,o.outline||'',o.shadow||'',f),dx+i*f.adv*sc,dy);
}

  C:'#d9d2e6', c:'#8a809c', X:'#ffffff', F:'#120a16', T:'#3a2e4a'

function sprite(rows,over){
  const h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const c=mk(w,h), g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<rows[y].length;x++){
    const ch=rows[y][x]; if(ch==='.'||ch===' ')continue;
    const col=(over&&over[ch])||PAL[ch]; if(!col)continue;
    g.fillStyle=col;g.fillRect(x,y,1,1);
  }
  return c;
}
function silhouette(src,col){const c=mk(src.width,src.height),g=c.getContext('2d');
  g.drawImage(src,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,c.width,c.height);return c;}
/* bordo di 1px attorno allo sprite (alone dei peccati, riflesso delle grazie) */
function outlined(src,col){const c=mk(src.width+2,src.height+2),g=c.getContext('2d'),s=silhouette(src,col);
  for(const[ox,oy]of[[0,1],[2,1],[1,0],[1,2]])g.drawImage(s,ox,oy);g.drawImage(src,1,1);return c;}
function toURL(c,sc=4){const b=mk(c.width*sc,c.height*sc),g=b.getContext('2d');g.imageSmoothingEnabled=false;
  g.drawImage(c,0,0,b.width,b.height);return b.toDataURL();}

const SPR={};
/* rimpicciolisce una mappa di pixel togliendo le righe e le colonne che somigliano di più
   alle vicine: la figura resta nitida, senza la sfocatura di un ridimensionamento */
function shrinkMap(rows,dr,dc){
  const W=Math.max(...rows.map(r=>r.length));
  const diff=(a,b)=>a.reduce((s,c,j)=>s+(c!==b[j]),0);
  // prima le righe vuote ai bordi, poi quelle quasi uguali a una vicina, lontane dal centro (dove stanno i dettagli)
  const drop=(m,n)=>{m=m.slice();for(let k=0;k<n;k++){let bi=1,bc=1e9;
      for(let i=0;i<m.length;i++){const edge=i===0||i===m.length-1;
        const c=edge?(m[i].every(ch=>ch==='.')?-1e3:1e8)
                    :Math.min(diff(m[i],m[i-1]),diff(m[i],m[i+1]))*100-Math.abs(i-(m.length-1)/2);
        if(c<bc){bc=c;bi=i;}}
      m.splice(bi,1);}return m;};
  const T=m=>m[0].map((_,j)=>m.map(r=>r[j]));
  let m=rows.map(r=>r.padEnd(W,'.').split(''));
  m=T(drop(T(drop(m,dr)),dc));
  return m.map(r=>r.join(''));
}

function dayState(){
  let t=((dayClock%DAY_T)+DAY_T)%DAY_T, i=0;
  while(i<3&&t>=PHASE_T[i]){t-=PHASE_T[i];i++;}
  const f=clamp((t-(PHASE_T[i]-DAY_FADE))/DAY_FADE,0,1);
  return{i,j:(i+1)%4,f:f*f*(3-2*f),t:(i+t/PHASE_T[i])/4};
}
function nightness(){const d=dayState();return lerp(SKY[d.i].night,SKY[d.j].night,d.f);}
let NIGHT=0;                     // nightness() del fotogramma corrente, calcolata una volta in draw()
function phaseName(){const d=dayState();return L(['ALBA','GIORNO','VESPRO','NOTTE'],['DAWN','DAY','DUSK','NIGHT'])[d.f>0.5?d.j:d.i];}

const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
let skyPat=null, skyKey='', SKY_LOW='#f2ac7c';
function updateSky(){
  const d=dayState(), q=Math.round(d.f*20)/20, key=d.i+':'+q+':'+GROUND;
  if(key===skyKey&&skyPat)return;
  skyKey=key;
  const top=mixHex(SKY[d.i].top,SKY[d.j].top,q), mid=mixHex(SKY[d.i].mid,SKY[d.j].mid,q),
        low=mixHex(SKY[d.i].low,SKY[d.j].low,q);
  SKY_LOW=low;
  const NB=8, bands=[];
  for(let k=0;k<=NB;k++){const t=k/NB;
    bands.push(hex2rgb(t<0.55?mixHex(top,mid,t/0.55):mixHex(mid,low,(t-0.55)/0.45)));}
  const c=mk(4,GROUND), g=c.getContext('2d'), id=g.createImageData(4,GROUND);
  for(let y=0;y<GROUND;y++){
    const v=y/(GROUND-1)*NB, lo=Math.min(NB-1,Math.floor(v)), fr=v-lo;
    for(let x=0;x<4;x++){
      const col=bands[fr>(BAYER[(y%4)*4+x]+0.5)/16?lo+1:lo], o=(y*4+x)*4;
      id.data[o]=col[0];id.data[o+1]=col[1];id.data[o+2]=col[2];id.data[o+3]=255;
    }
  }
  g.putImageData(id,0,0);
  skyPat=cx.createPattern(c,'repeat-x');
}

function makeCloud(seed,body,light,shade){
  const rnd=mulberry32(seed), w=30+Math.floor(rnd()*26), h=15, c=mk(w,h), g=c.getContext('2d');
  const n=3+Math.floor(rnd()*3), bumps=[];
  for(let i=0;i<n;i++)bumps.push([5+Math.floor((w-10)*i/(n-1)),9-Math.floor(rnd()*4),3+Math.floor(rnd()*3)]);
  for(const b of bumps)pxCircle(g,b[0],b[1],b[2],body);
  px(g,4,10,w-8,3,body);
  for(const b of bumps)pxCircle(g,b[0]-1,b[1]-1,Math.max(1,b[2]-2),light);
  g.clearRect(0,13,w,h);
  g.globalCompositeOperation='source-atop';px(g,0,11,w,2,shade);
  return c;
}

function farItems(FW){
  const rnd=mulberry32(1337), it=[]; let x=0;
  while(x<FW){
    const r=rnd(), w=10+Math.floor(rnd()*16), h=Math.floor(GROUND*(0.26+rnd()*0.22));
    it.push({x,w,h,type:r<0.3?'deco':r<0.46?'empire':r<0.58?'crown':r<0.8?'slab':'block',s:Math.floor(rnd()*1e6)});
    x+=w-2+Math.floor(rnd()*4);
  }
  return it;
}
function paintFar(g,it,FW,night){
  const col=night?'#12070b':'#5a6282', edge=night?'#1e0c12':'#6a7494', lit=night?0.22:0.06, red='#ff3a2a';
  px(g,0,GROUND-Math.floor(GROUND*0.2),FW,GROUND,col);
  for(const b of it)for(const dx of[0,-FW]){
    const x=b.x+dx; if(x>FW||x+b.w<0)continue;
    const top=GROUND-b.h, cxm=x+Math.floor(b.w/2), sr=mulberry32(b.s), tiers=[[x,top,b.w,b.h]];
    let peak=top;
    if(b.type==='deco'||b.type==='empire'){
      let tx=x,tw=b.w,ty=top;
      for(let i=0;i<3&&tw>6;i++){const ins=Math.max(1,Math.floor(tw/6)), th=Math.floor(b.h*(0.14+0.05*i));
        tx+=ins;tw-=ins*2;ty-=th;tiers.push([tx,ty,tw,th]);}
      const mh=Math.floor(b.h*(b.type==='empire'?0.3:0.16));
      if(b.type==='deco')pxTri(g,cxm,ty-mh,mh,col,0.2);
      else{px(g,cxm,ty-mh,1,mh,col);px(g,cxm-1,ty-Math.floor(mh*0.45),3,Math.floor(mh*0.45),col);}
      peak=ty-mh;
    }else if(b.type==='crown'){
      const r0=Math.floor(b.w/2);
      for(let i=0;i<3;i++){const r=r0-1-i*2;if(r<2)break;pxCircle(g,cxm,top-i*4,r,col);peak=top-i*4-r;}
      px(g,cxm,peak-8,1,8,col);peak-=8;
    }else if(b.type==='slab'){
      const tx=x+2+Math.floor(sr()*(b.w-8));
      px(g,tx,top-4,1,4,col);px(g,tx+4,top-4,1,4,col);px(g,tx-1,top-9,7,5,col);pxTri(g,tx+2,top-12,3,col,1);
    }else for(let i=0;i<b.w;i+=3)px(g,x+i,top-2,2,2,col);
    tiers.forEach(([tx,ty,tw,th],i)=>{
      px(g,tx,ty,tw,th,col);px(g,tx,ty,1,th,edge);
      if(i>0&&sr()<0.6){px(g,tx,ty-1,1,1,red);px(g,tx+tw-1,ty-1,1,1,red);}
      for(let wy=ty+3;wy<Math.min(GROUND-3,ty+th);wy+=4)for(let wx=tx+2;wx<tx+tw-1;wx+=3)
        if(sr()<lit)px(g,wx,wy,1,2,sr()<0.85?'#ffb85d':'#fff2b0');});
    if(b.type==='deco'||b.type==='empire'||b.type==='crown'){px(g,cxm,peak-1,1,1,red);
      if(night){g.globalAlpha=0.3;pxCircle(g,cxm,peak-1,2,red);g.globalAlpha=1;}}
  }
}

/* muro, spigoli e macchie del palazzo; restituisce i colori per il resto */
function facade(g,b,x,night){
  const top=GROUND-b.h, rnd=mulberry32(b.s);
  const base=night?mixHex(b.col,'#0c0508',0.64):b.col;
  const dark=mixHex(base,'#000000',0.32), light=mixHex(base,'#ffffff',0.14);
  px(g,x,top,b.w,b.h,base);px(g,x,top,1,b.h,light);px(g,x+b.w-2,top,2,b.h,dark);
  for(let i=0;i<b.w*b.h/26;i++)px(g,x+1+Math.floor(rnd()*(b.w-4)),top+3+Math.floor(rnd()*(b.h-4)),2,1,dark);
  return{top,base,dark,light,rnd,cxm:x+Math.floor(b.w/2),dim:c=>night?mixHex(c,'#0c0508',0.5):c};
}
function cornice(g,x,y,w,F){px(g,x-1,y-2,w+2,2,mixHex(F.dark,'#000000',0.25));px(g,x-1,y-2,w+2,1,F.light);}
/* griglia di finestre centrata nel riquadro; f disegna ciascuna finestra */
function winGrid(g,x,y,w,h,cw,ch,rnd,f){
  const cols=Math.max(1,Math.floor(w/cw)), rows=Math.max(1,Math.floor(h/ch));
  const ox=x+Math.floor((w-cols*cw)/2)+1, oy=y+Math.floor((h-rows*ch)/2)+1;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)f(ox+c*cw,oy+r*ch,rnd(),c,r,cols,rows);
}
function glass(lit,night){return night?(lit<0.5?'#ffd07a':lit<0.58?'#ff7fa8':'#1a1226'):(lit<0.38?'#f0a050':lit<0.7?'#6a6a90':'#2a2038');}
function win(g,wx,wy,ww,wh,col,night,dark){
  px(g,wx-1,wy-1,ww+2,wh+2,dark);px(g,wx,wy,ww,wh,col);
  if(col==='#6a6a90')px(g,wx,wy,1,2,'#8a8ab0');
  if(night&&col!=='#1a1226'){g.fillStyle=col;g.globalAlpha=0.18;g.fillRect(wx-2,wy-2,ww+4,wh+4);g.globalAlpha=1;
    if(ww>=4&&wh>=5&&Math.random()<0.12)figure(g,wx,wy,ww,wh);}          // qualcuno alla finestra
  if(REC&&night&&wx>=0&&wx<REC.w)REC.win.push({x:wx,y:wy,w:ww,h:wh,lit:col!=='#1a1226'});

function paintBuilding(g,b,x,night){
  if(b.kind==='fiume'){paintRiver(g,b,x,night);return;}
  const F=facade(g,b,x,night), top=F.top, G=GROUND, w=b.w, cm=F.cxm, dark=F.dark;
  const gold=F.dim('#f6c945'), goldD=F.dim('#b5812c');
  switch(b.kind){

  case'superbia':{      // torre a gradoni, oro e marmo, lo specchio in alto e la corona in cima
    const T=Math.floor(b.h*0.32);
    g.clearRect(x,top,6,T);g.clearRect(x+w-6,top,6,T);
    px(g,x+6,top,1,T,F.light);px(g,x+w-8,top,2,T,dark);
    cornice(g,x,top+T,w,F);px(g,x-1,top+T-2,w+2,1,gold);
    cornice(g,x+6,top,w-12,F);px(g,x+5,top-2,w-10,1,gold);
    // lo specchio
    pxCircle(g,cm,top+Math.floor(T/2)+1,5,goldD);pxCircle(g,cm,top+Math.floor(T/2)+1,4,gold);
    pxCircle(g,cm,top+Math.floor(T/2)+1,3,night?'#8ab0ff':'#cfe6ff');
    px(g,cm-2,top+Math.floor(T/2)-1,1,2,'#ffffff');px(g,cm-1,top+Math.floor(T/2)-2,1,1,'#ffffff');
    // finestre alte e strette con cornice d'oro
    winGrid(g,x+2,top+T+2,w-4,b.h-T-20,6,12,F.rnd,(wx,wy,l)=>{
      px(g,wx-1,wy-1,5,10,goldD);px(g,wx,wy,3,8,glass(l,night));px(g,wx,wy-1,3,1,gold);});
    // colonne d'oro, tappeto rosso

function paintStreet(g,W,H,night){
  const r=mulberry32(2024), holes=[], ink=night?'#0a0608':'#1e1216';
  for(let i=0;i<16;i++){let x=Math.floor(r()*(W-16)), y=6+Math.floor(r()*Math.max(1,H-8));const n=5+Math.floor(r()*10);
    for(let k=0;k<n;k++){px(g,x,y,1,1,ink);x++;y=clamp(y+(r()<0.33?-1:r()<0.5?1:0),5,H-1);}}
  for(let i=0;i<12;i++){g.globalAlpha=0.1+r()*0.1;pxCircle(g,Math.floor(r()*(W-8))+4,7+Math.floor(r()*Math.max(1,H-9)),1+Math.floor(r()*2),'#0a0406');}
  g.globalAlpha=1;
  const pud=night?'#10121e':'#4a6a90', refl=night?'#ffb85d':'#a8d0f0', puds=[];
  for(let i=0;i<5;i++){const x=Math.floor(r()*(W-24)), y=8+Math.floor(r()*Math.max(1,H-13)), w=8+Math.floor(r()*12);
    px(g,x+2,y,w-4,1,pud);px(g,x,y+1,w,2,pud);px(g,x+2,y+3,w-4,1,pud);px(g,x+3,y+1,3,1,refl);px(g,x+w-5,y+2,2,1,refl);
    puds.push({x,y,w});}
  for(let i=0;i<3;i++){const x=30+i*Math.floor(W/3)+Math.floor(r()*40), y=7+Math.floor(r()*Math.max(1,H-14));
    px(g,x+1,y-1,10,1,'#140a0e');px(g,x,y,12,3,'#140a0e');px(g,x+1,y+3,10,1,'#140a0e');
    for(let k=0;k<5;k++)px(g,x+2+k*2,y,1,3,night?'#2a1c1c':'#4a3a36');
    holes.push({x:x+6,y});}
  for(let i=0;i<24;i++){const x=Math.floor(r()*(W-6)), y=6+Math.floor(r()*Math.max(1,H-7)), k=r();
    if(k<0.3){px(g,x,y,4,2,night?'#5a5048':'#d9d0c0');px(g,x+1,y,1,2,night?'#3a3430':'#9a9080');}
    else if(k<0.5){px(g,x,y,2,1,night?'#6a2020':'#c83040');px(g,x+2,y,1,1,'#c8c8d0');}
    else if(k<0.75)px(g,x,y,1,1,'#e8e0d0');
    else px(g,x,y,2,2,night?'#4a3a30':'#a89878');}
  return{holes,puds};
}

function paintGround(g,W,H,night){
  const p=night?{curb:'#2a2024',curbL:'#3a2e32',curbD:'#0e080a',m:'#0e080a',st:['#1e1618','#22191c','#1a1315']}
               :{curb:'#6a5a58',curbL:'#8a7a74',curbD:'#2a1c1e',m:'#2a1c1e',st:['#4a3e40','#524446','#44383a']};
  px(g,0,0,W,H,p.m);
  px(g,0,0,W,1,p.curbL);px(g,0,1,W,2,p.curb);px(g,0,3,W,1,p.curbD);
  for(let i=0;i<W;i+=8)px(g,i,1,1,2,p.curbD);
  const rnd=mulberry32(55);
  const SW=[6,8,12,12,16,16,24];   // divisori di 48: il tile si ripete senza giunture
  let y=5,row=0;
  while(y<H){
    const sh=4+Math.min(3,row), sw=SW[Math.min(row,SW.length-1)], off=(row%2)*(sw/2);
    for(let x=-off;x<W;x+=sw){
      const c=p.st[Math.floor(rnd()*3)];
      px(g,x+1,y,sw-1,sh-1,c);px(g,x+1,y,sw-2,1,mixHex(c,'#ffffff',0.1));
    }
    y+=sh;row++;
  }
}

/* ==========================================================================
   12. GENERAZIONE CASUALE DI PECCATI E GRAZIE
   ========================================================================== */
const SIN_BY_WHERE={ground:SINS.filter(s=>s.where!=='air'),air:SINS.filter(s=>s.where!=='ground')};
/* esce sempre il peccato visto meno volte (mai due uguali di fila): tutti e sette girano alla pari */
let sinCount={}, lastSin=null;
function nextSin(where){
  const pool=SIN_BY_WHERE[where].filter(s=>s!==lastSin), n=s=>sinCount[s.id]||0;
  const min=Math.min(...pool.map(n));
  const def=lastSin=pick(pool.filter(s=>n(s)===min));
  sinCount[def.id]=n(def)+1;
  return def;
}
function addSin(where,x,bottom){
  const def=nextSin(where);
  const y=(bottom??GROUND)-16;
  sins.push({def,x,y,baseY:y,w:16,h:16,t:rand(6.28),vy:0,sw:0});
}
let lastGrace=null;
function addGrace(x,cy){                 // x = centro; mai la stessa grazia due volte di fila
  const pool=GRACES.filter(g=>g!==lastGrace).map(g=>({g,w:g.fx==='life'&&lives>=MAX_LIVES?2:g.w}));
  const g=lastGrace=weighted(pool).g;
  graces.push({g,x,y:cy,t:rand(6.28)});
}
/* spazio libero fra un'ondata e la successiva: costante, con appena un filo di variazione */
function waveSpace(){return speedNow*Math.max(0.85,1.45-(level-1)*0.07)*rand(0.92,1.08);}
/* peccato sospeso singolo: metà ad altezza testa (colpisce chi corre: va saltato con un
   salto lungo, l'Umiltà ci passa sotto), metà "a tetto" (ci passi sotto: punisce chi salta).
   Al livello 1 quelli alla testa stanno più bassi: la finestra per saltarli resta ~0,3 s */
const airHeight=()=>Math.random()<0.5?GROUND-randi(10,level<2?12:16):GROUND-randi(26,40);
/* schemi delle ondate: lv = livello in cui compaiono, d = difficoltà (0 facile … 3 difficile) */
const SIN_PATTERNS=[
  {lv:1,d:0,f:x=>addSin('ground',x)},
  {lv:1,d:0,f:x=>addSin('air',x,airHeight())},
  {lv:2,d:1,f:x=>{addSin('ground',x);addSin('ground',x+18+Math.round(speedNow*0.12));}},
  {lv:2,d:1,f:(x,gap)=>{addSin('ground',x);addSin('air',x+gap,GROUND-randi(30,44));}},
  {lv:3,d:2,f:(x,gap)=>{addSin('ground',x);addSin('ground',x+gap);addSin('ground',x+gap*2);}},
  {lv:3,d:1,f:x=>{addSin('air',x,GROUND-22);addSin('air',x+24,GROUND-22);}},
  {lv:5,d:3,f:(x,gap)=>{addSin('ground',x);addSin('air',x+gap,GROUND-26);addSin('ground',x+gap*2);}}
];
/* pesi per livello: gli schemi facili perdono peso a ogni livello, quelli difficili ne
   guadagnano da quando compaiono (livello 1: solo singoli · livello 8: singoli ~5%) */
function sinPatterns(lv){
  return SIN_PATTERNS.filter(p=>lv>=p.lv).map(p=>({f:p.f,
    w:p.d===0?Math.max(0.3,1.4-0.15*(lv-1)):1+0.25*p.d*(lv-p.lv)}));
}
/* crea un'ondata a partire da x e restituisce il suo bordo destro */
function spawnWave(x){
  const ns=sins.length, ng=graces.length;
  // niente peccati attorno alle soste di preghiera: lì si è al sicuro
  const crossNear=crosses.some(c=>c.x>LW-90)||(nextCross-dist)<70;
  if(graceIn<=0){                        // una grazia ogni 2-3 ondate di peccati, a ritmo regolare
    graceIn=randi(2,3);
    if(Math.random()<0.35&&!crossNear){ // rischio e premio: la grazia subito dopo il peccato, mai sopra
      addSin('ground',x);addGrace(x+32+Math.round(speedNow*0.1),GROUND-30);}
    else addGrace(x+11,Math.random()<0.4?GROUND-12:GROUND-randi(28,56));
  }else if(!crossNear){
    graceIn--;
    const gap=Math.round(speedNow*0.62);
    weighted(sinPatterns(level)).f(x,gap);
  }
  let right=x;                           // alone e contorni compresi
  for(let i=ns;i<sins.length;i++)right=Math.max(right,sins[i].x+20);
  for(let i=ng;i<graces.length;i++)right=Math.max(right,graces[i].x+11);
  return right;
}

/* ==========================================================================
   13. LE GRAZIE IN AZIONE
   ========================================================================== */
function applyGrace(g){
  score+=50*(on('glory')?2:1);
  const cxn=NUN.x+8, cyn=NUN.fy-12;
  burst(cxn,cyn,[g.col,'#fff2b0','#f6c945'],16,{vmax:90,kind:'spark'});
  sfx.grace();
  if(g.fx==='purge'){
    let n=0;
    for(const s of sins){if(s.x<LW+4){shatter(s,false);n++;}}
    sins=sins.filter(s=>!s.dead);
    score+=n*30;flash=0.6;flashCol='#a8ecff';
    announce(graceTxt(g).obj.toUpperCase(),n?L(`${n} PECCATI LAVATI`,`${n} SINS WASHED AWAY`):L('ANIMA PULITA','SPOTLESS SOUL'),'#a8ecff');
    sfx.purge();
  }else if(g.fx==='life'){
    if(lives<MAX_LIVES){lives++;announce(graceTxt(g).obj.toUpperCase(),L('+1 VITA','+1 LIFE'),'#ff4f8b');}
    else{score+=100;announce(graceTxt(g).obj.toUpperCase(),L('+100 PUNTI','+100 POINTS'),'#ff4f8b');}
  }else{
    powers[g.fx]=g.dur;powerMax[g.fx]=g.dur;
    announce(graceTxt(g).obj.toUpperCase(),graceTxt(g).sub,g.col==='#ffffff'?'#fff2b0':g.col);
  }
  floatText(cxn,cyn-14,on('glory')?'+100':'+50');
}
function shatter(s,points=true){
  s.dead=true;
  burst(s.x+8,s.y+8,['#ff4f8b','#a3285a','#ffffff','#7a1428'],14,{vmax:120});
  if(points){score+=25*(on('glory')?2:1);floatText(s.x+8,s.y-2,'+25','#ff9ac0');}
  sfx.shatter();
}
function hurt(s){
  if(state!=='run')return;               // già colpita in questo fotogramma
  if(on('shield')){shatter(s);return;}
  if(invuln>0)return;
  lives--;                               // ogni peccato costa una vita e riporta all'ultima croce
  flashCol='#ff4f8b';
  burst(NUN.x+8,NUN.fy-12,['#ff4f8b','#ffffff'],12);
  die(s.def);
}
function die(def){
  killer=def;crucis[def.id]=(crucis[def.id]||0)+1;state='dying';NUN.dead=true;NUN.deadT=0;NUN.vy=-170;NUN.onGround=false;
  announce(sinLabel(def).toUpperCase()+'!',lives>1?L(`RESTANO ${lives} VITE`,`${lives} LIVES LEFT`):lives===1?L('ULTIMA VITA','LAST LIFE'):L('LA TENTAZIONE HA VINTO','TEMPTATION WINS'),'#ff4f8b',2);
  shake=0.5;flash=0.8;
  sfx.die();music.stop();
}

/* ==========================================================================
   14. SOSTE DI PREGHIERA — il checkpoint
   ========================================================================== */
function checkpoint(ch){
  ch.reached=true;ch.glow=1.6;
  save={dist,score:Math.floor(score)};
  score+=200;
  announce(L('PREGHIERA ACCOLTA','PRAYER HEARD'),L('IL CIELO HA PRESO NOTA','HEAVEN TOOK NOTE'),'#fff2b0',2);
  floatText(ch.x+(SPR.cross.day.width>>1),GROUND-48,'+200');
  burst(ch.x+(SPR.cross.day.width>>1),GROUND-26,['#f6c945','#fff2b0','#ffffff'],26,{vmax:120,kind:'spark',life:1.1});
  sfx.bell();
}

/* ==========================================================================
   15. SALTO E PAUSA — salto, doppio salto, battito d'ali
   ========================================================================== */
function tryJump(){
  if(state!=='run')return false;
  if(NUN.onGround){
    NUN.vy=-JUMP_V;NUN.onGround=false;NUN.jumps=1;NUN.holding=true;
    dust(NUN.x+8,NUN.fy,5);sfx.jump();return true;
  }
  if(on('wings')){
    NUN.vy=-FLAP_V;NUN.holding=true;
    burst(NUN.x+2,NUN.fy-14,['#ffffff','#dfe8f6'],3,{vmin:10,vmax:40,grav:40,life:0.6});
    sfx.flap();return true;
  }
  if(NUN.jumps<2){
    NUN.vy=-JUMP2_V;NUN.jumps=2;NUN.holding=true;
    burst(NUN.x+8,NUN.fy,['#fff2b0','#f6c945'],6,{vmin:20,vmax:60,grav:0,life:0.35,kind:'spark'});
    sfx.jump2();return true;
  }
  return false;
}
function press(){
  if(state==='run'){if(!tryJump())NUN.buffer=0.13;}
}
function release(){
  NUN.holding=false;
  if(state==='run'&&NUN.vy<-80)NUN.vy=-80;     // salto corto se lasci presto
}
function togglePause(){
  if(state==='run'){state='pause';music.stop();}
  else if(state==='pause'){state='run';music.start();lastT=performance.now();}
}

/* ==========================================================================
   16. AGGIORNAMENTO
   ========================================================================== */
function update(dt){
  frameT+=dt;
  if(state==='title'||state==='over'||state==='pause'){
    if(state!=='pause'){scroll+=BASE_SPEED*0.35*dt;updateAmbient(dt);}
    return;
  }
  // --- velocità: cresce con la strada, rallenta con la Pazienza ---
  const dying=state==='dying';
  speedNow=speedTarget();
  const targetMul=dying?0:on('slow')?0.5:1;
  worldMul+=(targetMul-worldMul)*Math.min(1,dt*(dying?3:6));
  const spd=speedNow*worldMul, wdt=dt*worldMul;
  scroll+=spd*dt;dayClock+=dt;
  updateAmbient(dt);

  if(!dying){
    dist+=spd*dt;
    score+=spd*dt*0.5*(on('glory')?2:1);
    const lv=1+Math.floor(dist/LEVEL_DIST);
    if(lv>level){level=lv;if(banner.life<0.3)announce(L('ALTRO CHE PENSIONE!','RETIREMENT? NEVER!'),L('SI ACCELERA - LIVELLO ','SPEEDING UP - LEVEL ')+lv,'#a8ecff',1.3);sfx.level();}
    for(const k in powers){
      const before=powers[k];powers[k]=Math.max(0,powers[k]-dt);
      if(before>0&&powers[k]===0)sfx.expire();
    }
    invuln=Math.max(0,invuln-dt);
  }

  // --- suora ---
  const s=nunSize();
  if(dying){
    NUN.deadT+=dt;NUN.vy+=GRAV*0.8*dt;NUN.fy+=NUN.vy*dt;NUN.rot+=dt*5;
    if(NUN.deadT>1.5){if(lives>0)startGame(true);else gameOver();}
  }else{
    const g=on('wings')?(NUN.holding&&NUN.vy<0?170:300):(NUN.holding&&NUN.vy<0?GRAV*0.82:GRAV);
    NUN.vy=Math.min(NUN.vy+g*dt,on('wings')?110:340);
    NUN.fy+=NUN.vy*dt;
    if(NUN.fy-s.h<4){NUN.fy=4+s.h;NUN.vy=Math.max(0,NUN.vy);}
    if(NUN.fy>=GROUND){
      if(!NUN.onGround){dust(NUN.x+8,GROUND,NUN.vy>200?6:3);}
      NUN.fy=GROUND;NUN.vy=0;NUN.onGround=true;NUN.jumps=0;
    }else NUN.onGround=false;
    if(NUN.buffer>0){NUN.buffer-=dt;if(NUN.onGround&&tryJump())NUN.buffer=0;}
    NUN.anim+=dt*(6+4*speedNow/BASE_SPEED)*Math.max(0.5,worldMul);
    if(NUN.onGround&&Math.floor(NUN.anim)%2===0&&Math.random()<dt*6*speedNow/BASE_SPEED)
      dust(NUN.x+3,GROUND,1);
  }

  // --- generazione ---
  if(!dying){
    // a distanza, non a tempo: ogni ondata parte solo dopo la fine della precedente
    spawnGap-=spd*dt;
    if(spawnGap<=0){
      const x=LW+10+spawnGap;
      spawnGap=spawnWave(x)+waveSpace()-(LW+10);
    }
    if(dist>=nextCross){                 // una croce di strada ogni CROSS_DIST
      crosses.push({x:LW+8,reached:false,glow:0});
      nextCross+=CROSS_DIST;}
  }

  // --- soste di preghiera ---
  for(const ch of crosses){
    ch.x-=spd*dt;ch.glow=Math.max(0,ch.glow-dt);
    if(!ch.reached&&!dying&&ch.x+(SPR.cross.day.width>>1)<=NUN.x+8)checkpoint(ch);
  }
  crosses=crosses.filter(c=>c.x>-60);

  // --- peccati ---
  const nb=nunBox();
  for(const o of sins){
    o.t+=wdt;
    const b=o.def.beh;
    o.x-=spd*dt;
    if(b==='wave')o.y=o.baseY+Math.round(Math.sin(o.t*3)*8);
    else if(b==='drift'){               // ondeggia pigra sul posto, senza raggiungere gli altri
      const sw=Math.sin(o.t*1.3)*3;o.x+=sw-o.sw;o.sw=sw;
      o.y=o.baseY+Math.round(Math.sin(o.t*0.9)*3);
    }
    else if(b==='hop'){
      o.vy+=520*wdt;o.y+=o.vy*wdt;
      if(o.y>=o.baseY){o.y=o.baseY;o.vy=-rand(120,170);}
    }
    if(!dying&&!o.dead){
      const l=o.x+4,r=o.x+12,t=o.y+4,bt=o.y+13;     // disegno 14x14 al centro del riquadro 16x16
      if(r>nb.l&&l<nb.r&&bt>nb.t&&t<nb.b)hurt(o);
    }
  }
  sins=sins.filter(o=>!o.dead&&o.x>-24);

  // --- grazie ---
  const ncx=NUN.x+8, ncy=NUN.fy-(on('tiny')?7:12);
  for(const p of graces){
    p.t+=dt;
    p.x-=spd*dt;
    if(on('glory')&&!dying){
      const dx=ncx-p.x, dy=ncy-p.y, d=Math.hypot(dx,dy);
      if(d<130&&d>1){p.x+=dx/d*170*dt;p.y+=dy/d*170*dt;}
    }
    if(state==='run'&&!p.got&&Math.hypot(ncx-p.x,ncy-(p.y+Math.sin(p.t*3)*2))<(on('tiny')?10:12)){
      p.got=true;applyGrace(p.g);
    }
  }
  graces=graces.filter(p=>!p.got&&p.x>-20);

  // --- effetti ---
  for(const p of parts){p.life-=dt;p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.life-=dt;f.y-=18*dt;}
  floats=floats.filter(f=>f.life>0);
  banner.life=Math.max(0,banner.life-dt);
  flash=Math.max(0,flash-dt*2);shake=Math.max(0,shake-dt);
  if(!dying&&Math.floor(score)>best){best=Math.floor(score);}
  if(!recordFx&&!dying&&runBest>0&&score>runBest){          // record battuto: fuochi d'artificio
    recordFx=true;fwT=4.5;if(banner.life<0.3)announce(L('NUOVO RECORD!','NEW RECORD!'),L('ALLELUIA!','HALLELUJAH!'),'#f6c945',1.8);}
  // il record si scrive appena superato, poi al massimo ogni 2 s mentre continua a salire
  bestSaveT-=dt;if(best>bestSaved&&bestSaveT<=0){saveBest();bestSaveT=2;}
}
function updateAmbient(dt){
  const ds=scroll-lastScroll; lastScroll=scroll;
  for(const c of clouds){c.x-=c.sp*dt+ds*0.03;
    if(c.x<-60){c.x=LW+rand(10,80);c.y=randi(6,Math.floor(GROUND*0.4));}}
  // foglie portate dal vento
  for(const l of leaves){l.ph+=l.sp*dt;l.x-=l.vx*dt+ds*0.9;l.y+=Math.sin(l.ph)*14*dt+7*dt;
    if(l.x<-6||l.y>LH)Object.assign(l,newLeaf(false));}
  // stormi di uccelli
  if(!birds.length){birdWait-=dt;
    if(birdWait<=0){const n=randi(3,6), dir=pick([-1,1]), y0=randi(10,Math.floor(GROUND*0.32)), v=rand(26,36);
      for(let i=0;i<n;i++)birds.push({x:(dir>0?-8:LW+8)-dir*i*7,y:y0+Math.abs(i-(n>>1))*3,dir,v,ph:rand(6.28)});
      birdWait=rand(8,18);}}
  for(const b of birds){b.x+=b.dir*b.v*dt-ds*0.1;b.ph+=dt*9;b.y+=Math.sin(b.ph*0.15)*2*dt;}
  birds=birds.filter(b=>b.x>-80&&b.x<LW+80);
  // il dirigibile attraversa il cielo, lento
  if(!blimp){blimpWait-=dt;if(blimpWait<=0)blimp={x:LW+30,y:randi(3,Math.floor(GROUND*0.1)),v:rand(5,9)};}
  else{blimp.x-=blimp.v*dt+ds*0.06;if(blimp.x<-60){blimp=null;blimpWait=rand(14,28);}}
  // la metropolitana sulla sopraelevata
  if(!train){trainWait-=dt;
    if(trainWait<=0){const dir=pick([-1,1]);train={dir,x:dir<0?LW+10:-130,v:rand(75,100)};}}
  else{train.x+=train.dir*train.v*dt-ds*EL_F;
    if(train.x<-160||train.x>LW+40){train=null;trainWait=rand(6,14);}}
  // vapore dai tombini
  const holes=LAY.street&&LAY.street.holes;
  if(holes){const W=LAY.street.day.width, off=((scroll%W)+W)%W;
    for(const o of holes)for(const k of[0,W]){const sx=o.x-off+k;
      if(sx>-10&&sx<LW+10&&Math.random()<dt*4)steam.push({x:sx+rand(-2,2),y:GROUND+o.y,life:1.4,r:rand(1,2)});}}
  for(const s of steam){s.life-=dt;s.x-=ds*(s.f||1);s.y-=9*dt;s.r+=2.2*dt;s.x+=Math.sin(s.life*3)*4*dt;}
  steam=steam.filter(s=>s.life>0);
  // guardie e ladri: la volante insegue il ladro col sacco, sul marciapiede di là
  if(!chase){chaseWait-=dt;
    if(chaseWait<=0&&!traffic.length){const dir=pick([-1,1]);chase={dir,x:dir>0?-20:LW+20,v:rand(42,56),t:0};}}
  else{chase.t+=dt;chase.x+=chase.dir>0?chase.v*dt:-(chase.v*dt+ds*MID_F);
    if(chase.dir>0?chase.x>LW+80:chase.x<-90){chase=null;chaseWait=rand(22,40);}}
  // piccioni sul marciapiede: beccano finché la suora non arriva, poi si alzano in volo
  if(!pigeons.length){pigeonWait-=dt;
    if(pigeonWait<=0){const n=randi(3,5), x0=LW+rand(10,40);
      for(let i=0;i<n;i++)pigeons.push({x:x0+i*rand(5,9),y:GROUND+randi(5,11),dir:pick([-1,1]),
        peck:rand(2),fly:false,vx:0,vy:0,ph:rand(6.28)});
      pigeonWait=rand(6,14);}}
  let scared=false;
  for(const p of pigeons){
    if(!p.fly){p.x-=ds;p.peck-=dt;if(p.peck<-0.25)p.peck=rand(0.4,1.6);
      if(p.x<NUN.x+46){p.fly=true;p.dir=1;p.vx=rand(30,70);p.vy=-rand(45,75);scared=true;}}
    else{p.x+=p.vx*dt-ds*0.3;p.y+=p.vy*dt;p.vy-=10*dt;p.ph+=dt*16;}}
  if(scared&&state==='run')sfx.pigeons();
  pigeons=pigeons.filter(p=>p.x>-10&&p.y>-10&&p.x<LW+80);
  // il segnale della croce si accende nel cielo quando la prossima croce è vicina
  const want=(state==='run'||state==='dying')&&nextCross-dist<SIGNAL_DIST?1:0;
  signal+=(want-signal)*Math.min(1,dt*1.8);
  // traffico sulla strada di fondo: taxi gialli e auto, mai uno addosso all'altro
  trafficWait-=dt;
  if(trafficWait<=0&&!chase){trafficWait=rand(3,8);
    const dir=pick([-1,1]), last=traffic.filter(c=>c.dir===dir).pop();
    traffic.push({dir,x:dir>0?-40:LW+6,v:Math.min(rand(55,85),last?last.v:99),
      k:Math.random()<0.4?'taxi':'car'+randi(0,CAR_COLS.length-1)});}
  for(const c of traffic)c.x+=c.dir>0?c.v*dt:-(c.v*dt+ds*MID_F);
  traffic=traffic.filter(c=>c.x>-50&&c.x<LW+50);
  // l'elicottero col faro, solo di notte
  if(!heli){heliWait-=dt;
    if(heliWait<=0){if(NIGHT>0.6){const dir=pick([-1,1]);
      heli={dir,x:dir>0?-20:LW+20,y:randi(Math.floor(GROUND*0.14),Math.floor(GROUND*0.22)),t:0};}else heliWait=3;}}
  else{heli.t+=dt;heli.x+=heli.dir*14*dt-ds*0.15;heli.y+=Math.sin(heli.t*0.8)*3*dt;
    if(heli.x<-60||heli.x>LW+60){heli=null;heliWait=rand(20,40);}}
  // la chiatta risale il fiume
  const R=LAY.mid&&LAY.mid.rec;
  if(R&&R.river){bargeX+=5*dt;if(bargeX>R.river.w+10)bargeX=-60;}
  // finestre che si accendono e si spengono, insegne che sfarfallano
  if(R&&R.win.length){winT-=dt;
    if(winT<=0){winT=rand(0.2,0.8);const i=randi(0,R.win.length-1);
      if(winFx.length<14&&!winFx.some(f=>f.i===i))winFx.push({i,on:!R.win[i].lit,t:rand(3,12),who:Math.random()<0.3});}
    for(const f of winFx)f.t-=dt;winFx=winFx.filter(f=>f.t>0);
    for(const s of R.neon){s.t-=dt;
      if(s.t<=0){s.off=!s.off;s.t=s.off?rand(0.04,0.18):s.bad?(Math.random()<0.5?rand(0.05,0.2):rand(1,3)):rand(5,14);}}}
  // il sax suona, il carretto fuma
  const NI=LAY.near&&LAY.near.items;
  if(NI)for(const x0 of tileXs(LAY.near.day.width,NEAR_F))for(const o of NI){
    const sx=x0+o.x;if(sx<-30||sx>LW+10)continue;
    if(o.type==='hotdog'&&Math.random()<dt*5)steam.push({x:sx+15+rand(-1,1),y:GROUND-14,life:1.2,r:1,f:NEAR_F});
    else if(o.type==='sax'&&Math.random()<dt*1.4)notes.push({x:sx+9,y:GROUND-9,life:2,ph:rand(6.28)});}
  for(const m of notes){m.life-=dt;m.x+=Math.sin(m.ph+m.life*3)*6*dt-ds*NEAR_F;m.y-=10*dt;}
  notes=notes.filter(m=>m.life>0);
  // topi che attraversano il marciapiede
  if(!rats.length){ratWait-=dt;
    if(ratWait<=0){const dir=pick([-1,1]);rats.push({dir,x:dir>0?-6:LW+6,y:GROUND+randi(4,12),v:rand(80,120),ph:0});ratWait=rand(10,22);}}
  for(const r of rats){r.x+=r.dir*r.v*dt-ds;r.ph+=dt*20;}
  rats=rats.filter(r=>r.x>-12&&r.x<LW+12);
  // pioggia, ogni tanto, con i lampi
  if(rainT>0){rainT-=dt;rain=Math.min(1,rain+dt*0.25);}
  else{rain=Math.max(0,rain-dt*0.2);rainWait-=dt;if(rainWait<=0){rainT=rand(16,28);rainWait=rand(40,150);}}   // a caso, di giorno come di notte
  const nd=Math.round(110*rain);
  while(drops.length<nd)drops.push(newDrop());
  if(drops.length>nd)drops.length=nd;
  for(const d of drops){d.y+=d.v*dt;d.x-=d.v*0.25*dt+ds*0.3;
    if(d.y>=d.floor){splashes.push({x:d.x,y:d.floor,life:0.2});Object.assign(d,newDrop());}}
  for(const s of splashes){s.life-=dt;s.x-=ds;}
  splashes=splashes.filter(s=>s.life>0);
  const puds=LAY.street&&LAY.street.puds;
  if(puds&&rain>0.3)for(const x0 of tileXs(LAY.street.day.width,1))for(const p of puds){const sx=x0+p.x;
    if(sx>-p.w&&sx<LW&&Math.random()<dt*6*rain)ripples.push({x:sx+rand(2,p.w-2),y:GROUND+p.y+1+randi(0,1),r:0,life:0.6});}
  for(const r of ripples){r.life-=dt;r.r+=5*dt;r.x-=ds;}
  ripples=ripples.filter(r=>r.life>0);
  if(bolt){bolt.life-=dt;if(bolt.life<=0)bolt=null;}
  if(rain>0.6){boltWait-=dt;
    if(boltWait<=0){boltWait=rand(5,12);let x=rand(LW*0.15,LW*0.9),y=0;const pts=[[x,0]];
      while(y<GROUND*0.55){y+=randi(4,9);x+=randi(-5,5);pts.push([x,y]);}
      bolt={pts,life:0.3};if(state==='run'){flash=Math.max(flash,0.45);flashCol='#e8e8ff';sfx.thunder();}}}
  // fuochi d'artificio lontani
  if(fwT>0){fwT-=dt;fwNext-=dt;
    if(fwNext<=0){fwNext=rand(0.2,0.55);
      rockets.push({x:rand(LW*0.25,LW*0.95),y:GROUND*0.62,vy:-rand(75,100),fuse:rand(0.6,1),col:pick(FW_COLS)});}}
  for(const r of rockets){r.fuse-=dt;r.y+=r.vy*dt;r.vy+=25*dt;r.x-=ds*0.1;
    if(r.fuse<=0){for(let i=0;i<26;i++){const a=i/26*6.283, v=rand(22,40);
        sparks.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(0.8,1.3),col:Math.random()<0.2?'#fff2b0':r.col});}
      if(state==='run')sfx.pop();}}
  rockets=rockets.filter(r=>r.fuse>0);
  for(const s of sparks){s.life-=dt;s.vx*=1-dt*1.2;s.vy=s.vy*(1-dt*1.2)+30*dt;s.x+=s.vx*dt-ds*0.1;s.y+=s.vy*dt;}
  sparks=sparks.filter(s=>s.life>0);
}
function newDrop(){return{x:rand(-10,LW+60),y:rand(-40,-2),v:rand(180,240),floor:rand(GROUND+1,LH)};}

function tone(f,d,o={}){

  osc.connect(g);g.connect(o.bus||a.destination);osc.start(t);osc.stop(t+d+0.02);
}
function noise(d,vol=0.06,at,bus){

    const ch=NOISE.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}

   Do minore, forma AABA di 32 battute (un giro dura circa un minuto):

/* una nota con attacco e coda: più oscillatori, filtro e vibrato facoltativi */
function voice(f,d,o={}){

  const t=o.at??a.currentTime, atk=o.atk??0.01, rel=o.rel??0.12, vol=o.vol??0.04, hold=Math.max(atk,d), end=t+hold+rel+0.05;

  g.gain.setValueAtTime(vol,t+hold);g.gain.exponentialRampToValueAtTime(0.0001,t+hold+rel);

    if(o.bend){osc.frequency.setValueAtTime(f*mult*o.bend,t);osc.frequency.exponentialRampToValueAtTime(f*mult,t+0.06);}

const music={on:false,sec:'intro',ord:0,bar:0,step:0,next:0,timer:null,bus:null,

      const e=(60/126/4)/Math.sqrt(speedNow/BASE_SPEED);           // un sedicesimo a 126 bpm, più svelto con la corsa
      const t=this.next+(st%4===2?e*0.66:0);                       // lo swing: il levare arriva in ritardo
      if(st%4===0){const n=s.walk[this.bar][st/4];                  // il contrabbasso
        if(n)voice(midi(n),e*2.6,{at:t,atk:0.004,rel:0.22,vol:0.085,lp:600,osc:[['triangle',1,0],['sine',1,0]],bus});}
      const comp=this.bar%2?(st===6||st===14):(st===0||st===6);    // il piano, in sincope
      if(comp&&!(this.sec==='intro'&&st===14))for(const n of C.v)
        voice(midi(n),e*(st===0?1.2:2),{at:t,atk:0.004,rel:0.45,vol:0.011,osc:[['sine',1,0],['triangle',1,4]],bus});
      const d=s.drums;                                               // spazzole e ride
      if(d!=='light'||st%4===0){
        if(st%4===0||st===6||st===14)noise(st%4===0?0.12:0.07,d==='light'?0.007:0.012,t,bus);
        if(d!=='light'&&(st===4||st===12))noise(0.025,0.02,t,bus);
        if(d!=='light'&&(st===0||st===8))tone(110,0.14,{at:t,type:'sine',slide:0.45,vol:0.07,bus});
        if(d==='swing2'&&(st===10||(this.bar%2&&st===14)))noise(0.06,0.014,t,bus);}
      const c=s.at[this.bar*16+st];                                  // il sax, con un filo d'eco del locale
      if(c){const f=midi(c[0]), dd=e*c[1]*0.9, sax={atk:0.035,rel:0.12,lp:1700,q:1.4,vib:5.5,bend:0.95,osc:[['sawtooth',1,0],['square',1,6]],bus};
        voice(f,dd,{...sax,at:t,vol:0.026});voice(f,dd,{...sax,at:t+e*3,vol:0.006,bend:1});}
      this.next+=e;
      if(++this.step===16){this.step=0;
        if(++this.bar===s.bars.length){this.bar=0;
          if(this.sec==='intro')this.ord=0;else this.ord=(this.ord+1)%ORDER.length;
          this.sec=ORDER[this.ord];}}
    }}
};

   ...walk(3.8,[36,39,43,44,43,42,41,39,36,38,39,41,43,41,38]),...jazzKit(4.3,11),   // fino in fondo, pausa compresa
   ...chord(4.3,'pno',[63,67,70,74],0.3,0.012),...chord(5.9,'pno',[63,67,70,74],0.3,0.012),...chord(7.3,'pno',[60,63,65,68],0.3,0.012)],
  // 6. il portone: la band al completo, il sax suona il tema; sul titolo l'accordo finale
  [...walk(0,[36,39,43,42, 44,43,41,39, 41,44,48,47, 43,44]),...jazzKit(0,6.2),
   ...chord(0,'pno',[63,67,70,74],0.3,0.012),...chord(1.9,'pno',[60,63,67,68],0.3,0.012),...chord(3.8,'pno',[60,63,65,68],0.3,0.012),...chord(5.7,'pno',[59,62,65,68],0.3,0.012),
   ...[[67,0.9,0.22],[72,1.14,0.22],[74,1.38,0.45],[75,1.9,0.85],[74,2.86,0.22],[72,3.1,0.22],[70,3.34,0.45],[72,3.82,0.9],
       [75,4.77,0.22],[77,5.01,0.22],[79,5.25,0.7]].map(([n,t,d])=>[t,'sax',n,d]),
   [6.2,'timp'],[6.2,'crash'],[6.2,'bass',36,3],...chord(6.2,'pad',[48,55,63,67,74],3.6,0.012),...chord(6.2,'brass',[63,67,70,74],2.6),[6.2,'sax',84,2.6]]
];
const HOLDS={pad:1,org:1,brass:1};                // gli strumenti degli accordi tenuti; basso, sax e pianoforte restano a tempo
let IBUS=null;
function introAudioOk(){return!muted&&AC&&AC.state==='running';}
function introMusic(scene,offset){                // suona la scena da "offset" secondi in poi
  if(!introAudioOk())return;
  if(!IBUS){IBUS=AC.createGain();IBUS.gain.value=0.8;IBUS.connect(AC.destination);}
  const t0=AC.currentTime+0.05-offset, bus=IBUS, sc=INTRO[scene], end=sc?sc.d-sc.hold:0;
  for(const[t,k,n,d,v]of INTRO_MUS[scene]||[]){if(t<offset-0.01)continue;const at=t0+t;
    const dd=sc&&HOLDS[k]&&t+d>=end-0.6?d+sc.hold:d;   // gli accordi finali della scena durano anche nella pausa
    if(IV[k])voice(midi(n),dd,{...IV[k],...(v?{vol:v}:{}),at,bus});
    else if(k==='kick')tone(110,0.14,{at,type:'sine',slide:0.45,vol:0.08,bus});
    else if(k==='timp')tone(75,0.9,{at,type:'sine',slide:0.7,vol:0.22,bus});
    else if(k==='crash')noise(1.6,0.035,at,bus);
    else if(k==='ride')noise(0.1,0.011,at,bus);
    else if(k==='hat')noise(0.025,0.018,at,bus);
    else if(k==='bell')voice(midi(n),0.1,{at,atk:0.004,rel:2,vol:0.03,osc:[['sine',1,0],['sine',2.76,0],['sine',5.4,0]],bus});}
}
function introMusicStop(){if(IBUS&&AC){const b=IBUS;b.gain.setTargetAtTime(0,AC.currentTime,0.25);setTimeout(()=>b.disconnect(),1500);}IBUS=null;}
function introSndBtn(){const b=document.getElementById('isnd');if(b)b.classList.toggle('muted',!introAudioOk());}

const MADRE_T=2.8, CAP_CPS=20;                   // quando la Madre comincia a leggere; lettere al secondo delle didascalie
/* d: quanto dura la scena col suo ritmo; hold: secondi in più alla fine, per leggere con calma prima della
   dissolvenza (l'animazione continua, la musica resta veloce e i suoi accordi finali si allungano) */
const INTRO=[
  {d:8,hold:2,draw:inTrack,cap:t=>t<4.6?L("ESTATE 1974. LO STADIO TRATTIENE IL FIATO.",'SUMMER 1974. THE STADIUM HOLDS ITS BREATH.')
                              :L("GERTRUDE, VENT'ANNI, TAGLIA IL TRAGUARDO PER PRIMA.",'GERTRUDE, TWENTY, CROSSES THE LINE FIRST.'),
   tick:t=>{if(t>5)introOnce('cheer',()=>noise(1.8,0.05));}},
  {d:7.5,hold:2,draw:inMedal,cap:t=>t<3.6?L('POI, UNA NOTTE, APPESE LA MEDAGLIA A UN CHIODO...','THEN ONE NIGHT SHE HUNG HER MEDAL ON A NAIL...')
                                :L("...E SCELSE UNA CORSA PIU' LUNGA.",'...AND CHOSE A LONGER RACE.')},
  {d:7.5,hold:2,draw:inChapter,cap:t=>t<MADRE_T?L("CINQUANT'ANNI DOPO.",'FIFTY YEARS LATER.')
                                  :L('SETTEVIZI CHIEDE PREGHIERE. NESSUNO CI VA DA ANNI.','SETTEVIZI BEGS FOR PRAYERS. NO ONE HAS GONE IN YEARS.'),
   tick:t=>{const n=madreSyl();if(t>=MADRE_T&&n>=0&&n!==introBlip&&n%3===0){introBlip=n;tone(rand(260,420),0.06,{vol:0.025});}}},   // la Madre legge: una voce ogni tre lettere
  {d:5,hold:1,draw:inSilence,cap:()=>L("NESSUNA ALZO' LO SGUARDO.",'NOT ONE OF THEM LOOKED UP.'),
   tick:t=>{const b=Math.floor(t*1.4);if(b!==introBlip){introBlip=b;if(b>=2)[0,0.08].forEach(dl=>tone(4400,0.035,{vol:0.012,delay:dl}));}}},   // canta solo quando è fermo
  {d:9,hold:2,draw:inVolunteer,cap:t=>t<1.8?L('TRANNE UNA.','EXCEPT ONE.'):t<3.8?L('- CI VADO IO.',"- I'LL GO."):
                                  L("LE SCARPE ERANO ANCORA QUELLE DEL '74.","SHE STILL WORE THE SHOES FROM '74."),
  },
  {d:10,hold:2,draw:inGate,cap:t=>t<4.2?L("SETTANT'ANNI. TRE VITE. ZERO PAZIENZA.",'SEVENTY YEARS OLD. THREE LIVES. ZERO PATIENCE.')
                               :t<6.2?L('LA FEDE NON VA IN PENSIONE.','FAITH NEVER RETIRES.'):'',
   tick:t=>{if(t>0.6)introOnce('door',()=>tone(140,1.6,{type:'sawtooth',slide:1.8,vol:0.025}));}}
];
for(const s of INTRO)s.d+=s.hold;                 // da qui in poi d è la durata vera, pausa compresa
const INTRO_LEN=INTRO.reduce((a,s)=>a+s.d,0);
let introS=0, introT=0, introCap='', introCapT=0, introBlip=-1, introDone={};
function introOnce(k,f){if(!introDone[introS+k]){introDone[introS+k]=1;f();}}
/* la lettera della didascalia che compare ora: -1 sugli spazi e a frase finita, così voce e bocca vanno col testo */
function madreSyl(){const n=Math.floor(introCapT*CAP_CPS);return n<introCap.length&&/[A-Z0-9]/i.test(introCap[n])?n:-1;}
const ILANG=document.getElementById('ilang');
function playIntro(){OV.style.display='none';hudButtons(false);music.stop();ILANG.style.display='flex';
  state='intro';introS=0;introT=0;introCap='';introCapT=0;introBlip=-1;introDone={};
  ac();introMusicStop();introMusic(0,0);introSndBtn();}
window.playIntro=playIntro;
function endIntro(){store.set('nunner_intro','1');ILANG.style.display='none';introMusicStop();state='title';titleCard();}
function updateIntro(dt){
  frameT+=dt;introT+=dt;
  let sc=INTRO[introS];
  if(introT>=sc.d){introT-=sc.d;introS++;introBlip=-1;if(introS>=INTRO.length){endIntro();return;}sc=INTRO[introS];introMusic(introS,introT);}
  if(sc.tick)sc.tick(introT);
  const c=sc.cap(introT);if(c!==introCap){introCap=c;introCapT=0;}else introCapT+=dt;
}
function drawIntro(){
  const sc=INTRO[introS], t=introT,{bt,bb}=stage();
  cx.fillStyle='#000000';cx.fillRect(0,0,LW,LH);
  sc.draw(t);
  px(cx,0,0,LW,bt,'#000000');px(cx,0,LH-bb,LW,bb,'#000000');
  if(introCap){                                                                 // la didascalia, a capo sugli schermi stretti
    const ls=textLines(introCap,LW-12,1,FONT5), lh=FONT5.h+3, h=ls.length*lh-3;
    let n=Math.floor(introCapT*CAP_CPS), y=LH-bb+Math.round((bb-h)/2);
    for(const l of ls){if(n<=0)break;                                          // le righe si scrivono una dopo l'altra
      const vis=l.slice(0,n);text(cx,vis,Math.round(LW/2-textW(l,1,FONT5)/2),y,'#f4ecdc',{font:FONT5});
      n-=l.length+1;y+=lh;}}
  const done=INTRO.slice(0,introS).reduce((a,s)=>a+s.d,0)+t;                    // quanto manca
  px(cx,0,LH-bb,Math.round(LW*done/INTRO_LEN),1,'#7a1428');
  cx.globalAlpha=0.6+0.3*Math.sin(frameT*3);                                   // salta
  const sy=Math.round((bt-5)/2);
  text(cx,L('SALTA','SKIP'),LW-11,sy,'#b9acc0',{align:'right'});
  for(let i=0;i<3;i++)px(cx,LW-8+i,sy+i,1,5-2*i,'#b9acc0');
  cx.globalAlpha=1;
  const FADE=1.1, f=Math.max(0,1-t/FADE,1-(sc.d-t)/FADE);                                 // dissolvenze
  if(f>0){cx.globalAlpha=Math.min(1,f);cx.fillStyle='#000000';cx.fillRect(0,0,LW,LH);cx.globalAlpha=1;}
}

/* ==========================================================================
   22. DIMENSIONI — pixel interi quando possibile
   ========================================================================== */
function resize(){
  const aw=window.innerWidth, ah=window.innerHeight, oldG=GROUND;
  let s=Math.max(1,Math.round(ah/200));
  if(aw/s<280)s=aw/280;                         // schermi stretti: scala frazionaria
  SCALE=s;LW=Math.floor(aw/s);LH=Math.min(250,Math.floor(ah/s));
  CV.width=LW;CV.height=LH;
  CV.style.width=Math.round(LW*s)+'px';CV.style.height=Math.round(LH*s)+'px';
  cx=CV.getContext('2d');cx.imageSmoothingEnabled=false;
  GROUND=LH-Math.max(28,Math.round(LH*0.17));
  const dG=GROUND-oldG;
  for(const o of sins){o.y+=dG;o.baseY+=dG;}
  for(const p of graces)p.y+=dG;
  NUN.fy=(state==='run'||state==='dying')?Math.min(NUN.fy+dG,GROUND):GROUND;
  NUN.x=Math.max(28,Math.round(LW*0.14));
  buildScenery();initAmbient();
}

/* ==========================================================================
   23. INPUT — tastiera, mouse e tocco
   ========================================================================== */
const JUMP_KEYS=['Space','ArrowUp','KeyW'];
window.addEventListener('keydown',e=>{
  if(state==='intro'){e.preventDefault();if(!e.repeat)endIntro();return;}     // un tasto qualsiasi salta l'intro
  if(OV.style.display!=='none'){
    if((e.code==='Enter'||e.code==='Space')&&!e.repeat){e.preventDefault();const b=CARD.querySelector('button.go');if(b)b.click();}
    return;
  }
  if(JUMP_KEYS.includes(e.code)){e.preventDefault();if(!e.repeat)press();}
  else if(e.code==='KeyP'||e.code==='Escape')togglePause();
  else if(e.code==='KeyM')toggleMute();
});
window.addEventListener('keyup',e=>{if(JUMP_KEYS.includes(e.code))release();});
CV.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='intro'){endIntro();return;}if(state==='pause'){togglePause();return;}press();});
window.addEventListener('pointerup',release);
window.addEventListener('pointercancel',release);
BTN_P.addEventListener('pointerdown',e=>e.stopPropagation());
BTN_P.addEventListener('click',()=>togglePause());
BTN_M.addEventListener('pointerdown',e=>e.stopPropagation());
BTN_M.addEventListener('click',()=>{ac();toggleMute();});
window.addEventListener('contextmenu',e=>e.preventDefault());   // niente menu del browser col tocco lungo
/* niente lente d'ingrandimento né selezione col tocco lungo (Safari su iPhone): fuori da pulsanti e schermate */
document.addEventListener('touchstart',e=>{if(!e.target.closest('button,.card,#ilang'))e.preventDefault();},{passive:false});
window.addEventListener('blur',()=>{if(state==='run')togglePause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveBest();if(state==='run')togglePause();}});
window.addEventListener('pagehide',saveBest);                 // pagina chiusa o ricaricata: il record non si perde
window.addEventListener('resize',resize);

/* ==========================================================================
   24. CICLO PRINCIPALE E AVVIO
   ========================================================================== */
const Q=new URLSearchParams(location.search);
function autopilot(dt){                       // solo per le prove: ?auto gioca da solo
  if(state!=='run')return;
  invuln=Math.max(invuln,1);             // e non muore mai
  const ahead=sins.find(o=>o.x>NUN.x+4&&o.x<NUN.x+14+speedNow*0.3&&o.y+16>GROUND-26);
  if(ahead&&NUN.onGround)press();
  if(!NUN.onGround&&NUN.vy>-40)release();
}
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,Math.max(0,(ts-lastT)/1000));lastT=ts;
  if(state==='intro'){updateIntro(dt);if(state==='intro'){drawIntro();return;}}
  if(state==='title'||state==='over')NUN.anim+=dt*9;
  if(Q.has('auto'))autopilot(dt);
  if(state!=='pause')update(dt);
  draw();
}
function drawSheet(){                         // solo per le prove: ?sheet mostra tutti gli sprite su un foglio
  CV.width=300;CV.height=210;CV.style.width='1200px';CV.style.height='840px';
  cx=CV.getContext('2d');cx.imageSmoothingEnabled=false;
  cx.fillStyle='#6a6a8a';cx.fillRect(0,0,300,210);
  let x=4,y=4;
  const put=img=>{if(x+img.width>296){x=4;y+=28;}cx.drawImage(img,x,y);x+=img.width+4;};
  const row=()=>{x=4;y+=28;};
  SPR.nun.run.forEach(put);put(SPR.nun.jump);put(SPR.nun.fall);put(SPR.nun.dead);SPR.nunGold.run.forEach(put);
  row();SPR.mini.run.forEach(put);put(SPR.mini.jump);SPR.wings.forEach(put);put(SPR.halo);put(SPR.heart);put(SPR.heartE);put(SPR.crossIcon);
  row();SINS.forEach(s=>put(SPR.sin[s.id].glowA));
  row();GRACES.forEach(g=>put(SPR.grace[g.id].glow));
  row();put(SPR.cross.day);
  text(cx,'ABCDEFGHIJKLMNOPQRSTUVWXYZ',60,y+4,'#ffffff');text(cx,"0123456789 !?:.,'-+/x%",60,y+12,'#ffffff');
  text(cx,'PREGHIERA',60,y+22,'#f6c945',{sc:2,outline:'#140c1c'});
}

buildSprites();
SPR.cross=buildCross();
buildCelestial();buildClouds();buildStreetLife();buildIntroSprites();
for(const s of SINS)SPR.sin[s.id].url=toURL(SPR.sin[s.id].base);
for(const g of GRACES)SPR.grace[g.id].url=toURL(SPR.grace[g.id].base);
if(Q.has('lang'))LANG=Q.get('lang')==='en'?'en':'it';   // solo per le prove: ?lang=en
applyLang();
if(Q.has('sheet')){OV.style.display='none';drawSheet();}
else{
  resize();
  if(Q.has('d'))dist=parseFloat(Q.get('d'))||0;                      // solo per le prove: metri già percorsi
  if(Q.has('t'))dayClock=parseFloat(Q.get('t'))||0;   // solo per le prove: secondi del giorno
  if(Q.has('auto')){startGame(false);if(Q.has('d')){dist=parseFloat(Q.get('d'));score=dist/2;
    nextCross=(Math.floor(dist/CROSS_DIST)+1)*CROSS_DIST;level=1+Math.floor(dist/LEVEL_DIST);}
    if(Q.has('fx'))for(const k of Q.get('fx').split(',')){powers[k]=5;powerMax[k]=6;}
    for(let i=0,n=parseInt(Q.get('sim'))||0;i<n;i++){autopilot(1/60);update(1/60);}   // simula N fotogrammi
    music.stop();}
  else if(store.get('nunner_intro','')!=='1')playIntro();          // la prima volta, l'intro
  else titleCard();
  requestAnimationFrame(ts=>{lastT=ts;requestAnimationFrame(loop);});
}
